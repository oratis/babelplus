# electron-builder 配置。**现在还打不出可分发的包**，理由与门槛写在 README §签名。
#
# 这份文件先落下来，是为了让「打包这一步缺什么」是一个可读的清单，而不是一句「以后再说」：
#   · macOS：Developer ID 证书 + 公证（$99/年，需 Apple 账号）
#   · Windows：Azure Artifact Signing（EV 证书已不再绕过 SmartScreen，2026-05 官方口径）
#   · 随包内核：现在是 GitHub release 的官方二进制（TOFU 校验和），
#     分发前必须改成自编译（spec §4.5：杀软误报 + 供应链）
appId: plus.babel.browser
productName: babel.plus
copyright: babel.plus
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # 随包内核。vendor/ 不入库，由 `pnpm core` 取（见 scripts/fetch-core.mjs）。
  - from: vendor
    to: vendor
    filter: ['**/*']
mac:
  category: public.app-category.productivity
  target: [{ target: dmg, arch: [arm64, x64] }]
  # 🔴 硬化运行时 + 公证是 Gatekeeper 的前提，两者都需要证书。
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target: [{ target: nsis, arch: [x64] }]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
