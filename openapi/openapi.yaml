  /api/v1/payment/notify/{provider}:
    post:
      tags: [user]
      operationId: handlePaymentNotify
      summary: 支付回调（**公开端点，验签**）
      description: |
        幂等键是 `(provider, external_id)` 上的**唯一索引**，不是应用层的 `SELECT … IF NOT EXISTS`
        （后者在两个 Cloud Run 实例并发处理同一次重投时会双双通过）。重复投递静默返回 200，**不重复入账**。

        验签失败 → 401 `PAYMENT_SIGNATURE_INVALID`。
        **收到回调后必须反向查单**，以网关/链上的权威金额为准。
        开通是**一个事务**：写配额 + 写到期 + 改状态 + bump `user_rev` ——
        少 bump 一次，用户付了钱但节点在下个 `user_rev` 变更前都看不到他。

        订单 `expires_at` 到点后状态转 `expired`，**但该收款地址必须继续监听 ≥ 24 小时**；
        期间到账的资金**入账为余额，不直接开通订阅**（余额仅可消费不可提现，资金合规上安全）。
        **不做这一条，用户第一次付款的钱就真的进黑洞。**

        响应体形状由各网关决定（多数要求纯文本 `success`），因此这里不套信封。
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: 支付网关标识
          schema:
            type: string
            pattern: '^[a-z0-9_]{2,32}$'
      requestBody:
        required: true
        description: 网关自定义载荷，形状由各网关决定，服务端只信验签后的字段。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 已受理（网关多数要求纯文本 `success`）
          content:
            text/plain:
              schema:
                type: string
              example: success
        '400':
          $ref: '#/components/responses/ErrBadRequest'
        '401':
          $ref: '#/components/responses/ErrUnauthorized'
        '500':
          $ref: '#/components/responses/ErrInternal'

