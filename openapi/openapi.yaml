  /internal/tasks/traffic-batch:
    post:
      tags: [internal]
      operationId: runTrafficBatchTask
      summary: 流量入账（Cloud Tasks，由 `/push` 入队）
      description: |
        幂等键 `traffic_batch.batch_id`（**服务端**在 `/push` 时生成）：
        `UPDATE traffic_batch SET claimed_at = now() WHERE batch_id = $1 AND claimed_at IS NULL`
        抢占失败 → 200 幂等丢弃。

        累加用 `RETURNING` 判断是否跨过 `transfer_enable` 阈值，**只在跨越的那一次 bump `user_rev`** ——
        不补这一条，配额耗尽的用户永远不会从节点列表消失（= 免费无限上网）。

        > 🔴 **Cloud Tasks 侧的重投能治，v2node 侧的超时重试治不了**（§9.2）：
        > v2node 上报增量字节且不带幂等键，我们无法从服务端区分「重试的同一批」与「下一个 60 秒窗口的新一批」。
        > 缓解只有「让 `/push` 快」与「让重复可见」（同 `node_id` 两次 `/push` 间隔 < 5 秒写 WARN + metric），没有根治。
      security:
        - internalOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficBatchTaskRequest'
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'

  /internal/tasks/alive-gc:
    post:
      tags: [internal]
      operationId: runAliveGcTask
      summary: 在线态清理（Scheduler，5 分钟）
      description: '`DELETE FROM user_alive WHERE seen_at < now() - interval ''5 minutes''` —— 天然幂等。'
      security:
        - internalOidc: []
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'

  /internal/tasks/expire-check:
    post:
      tags: [internal]
      operationId: runExpireCheckTask
      summary: 到期扫描（Scheduler，**5 分钟**）
      description: |
        **频率是 5 分钟而不是每日**：到期是时间驱动的状态变化，**没有任何写操作会触发 `user_rev` 的更新** ——
        这是 ETag 设计里最容易漏的一条。

        ```sql
        SELECT id, group_id FROM users WHERE expired_at > $last_run AND expired_at <= now();
        UPDATE servers SET user_rev = user_rev + 1 WHERE group_ids && $affected_groups;
        ```

        **代价：到期后最长 5 分钟 + 60 秒轮询 ≈ 6 分钟仍可上网**（按 Hysteria2 实测 ~1700 KB/s 上限约 612 MB，
        约 ¥0.06–0.15/人次，经济上可忽略）。
      security:
        - internalOidc: []
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'

  /internal/tasks/order-timeout:
    post:
      tags: [internal]
      operationId: runOrderTimeoutTask
      summary: 订单超时（Scheduler，1 分钟）
      description: |
        订单 `expires_at` 到点 → `status = expired`，**但该收款地址必须继续监听 ≥ 24 小时**；
        期间到账的资金**入账为余额，不直接开通订阅**。
      security:
        - internalOidc: []
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'

