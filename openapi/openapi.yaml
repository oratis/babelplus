    post:
      tags: [admin]
      operationId: markAdminOrderPaid
      summary: 手工标记订单已支付（**D6 · 全系统最大的内部欺诈面，四层全开**）
      description: |
        四层强制**全部**适用：

        - **L1** `confirmation` 必须等于订单所属用户的邮箱（服务端自查后常数时间比对）
        - **L2** `reason` ≥ 8 字符
        - **L3** `X-TOTP-Code` 必须有效且未被用过（同一 code 5 分钟内只能用一次，需 `used_totp` 表防重放）
        - **L4** 调用者必须持有 `admin.order.mark_paid` 权限位，**默认不授予，即使团队只有一个人**

        审计日志记 `before`/`after` 的完整订单状态 + `evidence_url`，与业务写入同事务。

        > **这个权限位必须从第一天就存在，即使团队只有一个角色。**
        > 一个「等有第二个人再加权限系统」的计划，在有第二个人的那天已经来不及了。
      security:
        - adminSession: []
          adminIap: []
      parameters:
        - $ref: '#/components/parameters/TradeNoPath'
        - $ref: '#/components/parameters/TotpCodeHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPaidRequest'
            example:
              confirmation: user@example.com
              reason: 链上 txid 7f3a… 已确认到账，网关回调丢失，人工补单
              evidence_url: https://tronscan.org/#/transaction/7f3a
      responses:
        '200':
          description: 已标记
          content:
            application/json:
              schema:
                type: object
