          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'
        '503':
          $ref: '#/components/responses/ErrDependencyDown'

  /internal/tasks/mail-send:
    post:
      tags: [internal]
      operationId: runMailSendTask
      summary: 发信（Cloud Tasks，按需）
      description: '幂等键 `mail_queue.id`。送达结果回写 `email_probe` / `mail_log`。'
      security:
        - internalOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailSendTaskRequest'
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'
        '503':
          $ref: '#/components/responses/ErrDependencyDown'

  /internal/tasks/remind-sweep:
    post:
      tags: [internal]
      operationId: runRemindSweepTask
      summary: 到期/流量提醒扫描（Scheduler，每日）
      description: |
        幂等键 `(user_id, remind_kind, day)`。
        **`service_broadcast` 类通知不受用户开关控制**（生命线不能被用户关掉，见 `updateNotificationPrefs`）。
      security:
        - internalOidc: []
      responses:
        '200':
          $ref: '#/components/responses/InternalTaskAck'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '500':
          $ref: '#/components/responses/ErrInternal'

components:

  securitySchemes:
    userSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **用户面会话。** 短期 access JWT（15 分钟）+ refresh token（30 天，一次性轮换）。
        CORS 只允许 Web 域名池。失败 401（`AUTH_TOKEN_EXPIRED` 时前端应静默 refresh 一次）。

    nodeKey:
      type: http
      scheme: bearer
      bearerFormat: bpn_<key_id>_<secret>
      description: |
        **节点面每节点独立密钥。** 形态 `bpn_7f3a2c_kQ2mXv9pL4nR8tZ1wY6bC3dF5gH7jK0sA2eU4iO6`。

        - DB 只存 `sha256(secret)`，比对用 `subtle.ConstantTimeCompare`
        - 支持在线轮换与吊销（一个节点可同时持有多把有效密钥）
        - **`node_id` 从密钥推导**，请求里带的 `node_id` 一律忽略；不一致 → 403 `NODE_ID_MISMATCH` + 告警。
          这是 Xboard/SSPanel「持 token 者可冒充任意节点」漏洞的**根治点**，不是缓解
        - **scope 白名单是 Go 里的常量 map（`method + 精确路径 → 所需 scope`），不从 DB 读**，
          且是**精确匹配不是前缀匹配**（前缀匹配会意外放行任何以 `/user` 开头的未来路由）

        每个节点面 operation 用扩展字段 `x-required-scope` 声明所需 scope。
        OpenAPI 的 security requirement 只允许 oauth2/openIdConnect 携带 scope 数组，
        而这里的机制不是 OAuth，所以 scope 走扩展字段而不是伪装成 OAuth 流程：

        | scope | 授权的路由（精确匹配） |
        |---|---|
        | `node:config:read` | `GET /api/v1/server/UniProxy/config` |
        | `node:users:read` | `GET /api/v1/server/UniProxy/user` |
        | `node:traffic:write` | `POST /api/v1/server/UniProxy/push` |
        | `node:alive:write` | `POST /api/v1/server/UniProxy/alive` |
        | `node:alive:read` | `GET /api/v1/server/UniProxy/alivelist` |
        | `node:status:write` | `POST /api/v1/server/UniProxy/status` |

    nodeKeyQueryTransitional:
      type: apiKey
      in: query
      name: token
      description: |
        🔴 **有期限的过渡态，不是目标态。**

        已知事实：XrayR 用 resty 的 `SetQueryParams` 把 `token` / `node_id` / `node_type`
        全局挂在 query string 上，v2node 是它的同源继任者，**很可能根本不发 `Authorization` 头**
        （api-contract.md §3.2.4 —— 这是整份契约最大的未验证风险）。

        目标态是**给 v2node 打补丁**（MPL-2.0 是文件级 copyleft，改动约 20 行，代价是维护一个 fork）。
        在补丁落地前，过渡态的三条硬约束：

        1. query 形态的 token **也必须是每节点独立密钥**，绝不接受全局共享 token
        2. 每次经 query 认证都写一条 `WARN` 结构化日志（带 `key_id`），使其在监控上可见、可计数
        3. **在 ADR 0007 阶段 5（全量切换）之前必须关闭 query 形态。**
           若届时未关闭，等于永久接受，应重开 ADR 显式承认而不是让它默认留存

        代价：凭据会进 access log 与可能的 Referer —— 加固三条只保住两条。

    adminSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **管理面会话。** 三道闸中的第二道。失败 **403**（不是 401 —— 管理面不告诉未授权者「这里有东西」）。
        与 `adminIap` **同时**要求（security requirement 里写在同一个对象里 = AND）。

        危险操作另有四层强制（api-contract.md §6.2）：
        L1 确认串（body `confirmation` 由**服务端**查出目标标识串后常数时间比对）、
        L2 必填 `reason`（≥ 8 字符）、L3 `X-TOTP-Code` step-up（5 分钟内只能用一次，防重放）、
        L4 独立权限位（`admin.order.mark_paid` / `admin.user.export`，**默认不授予**）。

    adminIap:
      type: apiKey
      in: header
      name: X-Goog-IAP-JWT-Assertion
      description: |
        **Identity-Aware Proxy 断言。** 三道闸中的第一道（独立主域名 + IAP/IP 白名单 + 强制 TOTP）。
        IAP 与 TOTP 是**两套独立凭据，任一泄漏不足以进入**。

        ⚠️ 校验的是 IAP 签发的 JWT，不是「这个头存在」——
        **拒绝把可伪造的头当作判据**（ADR 0006 §10.3）。

    internalOidc:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
      description: |
        **内部面。** 调用方是 Cloud Tasks / Pub-Sub push / Cloud Scheduler，
        凭据是 Google 签发的 OIDC ID token，校验三项：
        `aud` = 本服务 URL、`iss` = `https://accounts.google.com`、`email` = 指定的 service account。失败 403。

        `/internal/tasks/*` 与公网端点在**同一个 Cloud Run service**（「不要常驻 worker」的直接后果）。
        **它的保护是 OIDC 校验，不是路径保密 —— 路径不是秘密，token 才是。**

  parameters:
    NodeIdQuery:
      name: node_id
      in: query
      required: false
      description: |
        **只用于日志与一致性检查，不用于查询。** 权威来源是密钥绑定的 `node_keys.node_id`。
        与密钥绑定的不一致 → 403 `NODE_ID_MISMATCH` + 写告警（**不是静默忽略** ——
        静默忽略会让「配置写错了哪台机器」这类事故无法被发现）。
      schema:
        type: integer
        format: int64
        minimum: 1

    NodeTypeQuery:
      name: node_type
      in: query
      required: false
      description: '**只用于日志。** 节点类型的权威来源是 `servers.type`。'
      schema:
        type: string
      example: v2node

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        上一次响应的 `ETag`。**弱比较**（RFC 9110 §8.8.3.2），命中返回 304。

        > 🔴 **v2node 是否发送这个头 需实测。不发则整套 ETag 一行都不生效**
        > （ADR 0006 §11.4 已记为最高优先级）。ETag 不是优化，是让请求量算得平的前提：
        > 10 节点 = 1,728,000 请求/月，占 Cloud Run 免费额度 200 万/月的 86%。
      schema:
        type: string
      example: W/"3-u482"

    IdPath:
      name: id
      in: path
      required: true
      description: 资源主键
      schema:
        type: integer
        format: int64
        minimum: 1

    TradeNoPath:
      name: trade_no
      in: path
      required: true
      description: 订单号
      schema:
        type: string
        minLength: 6
        maxLength: 64

    TicketPublicIdPath:
      name: public_id
      in: path
      required: true
      description: 工单对外 ID（不暴露自增主键）
      schema:
        type: string
        minLength: 6
        maxLength: 64

    SubscribeTokenQuery:
      name: token
      in: query
      required: true
      description: 订阅 token。长度/字符集不合法 → **直接 404，不查库**。
      schema:
        type: string
        minLength: 16
        maxLength: 64

    SubscribeTokenPath:
      name: token
      in: path
      required: true
      description: 订阅 token。长度/字符集不合法 → **直接 404，不查库**。
      schema:
        type: string
        minLength: 16
        maxLength: 64

    SubscribeFlagQuery:
      name: flag
      in: query
      required: false
      description: |
        强制指定格式，覆盖 User-Agent 匹配（照抄 Xboard 的 `flag` 参数语义）。
      schema:
        type: string
        enum: [clash, singbox, base64]

    LimitQuery:
      name: limit
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: |
        游标，base64url 编码的 `{"id":…,"at":"…"}`。**不签名**（它只是位置不是凭据），
        但服务端必须校验解出的字段类型。
      schema:
        type: string
        maxLength: 512

    CountQuery:
      name: count
      in: query
      required: false
      description: |
        额外触发一次 `COUNT(*)`，结果写进 `meta.total`。**仅管理面提供**。
        理由：`COUNT(*)` 在 `db-f1-micro`（0.6 GiB RAM、25 连接）上是实打实的开销，不能让每次翻页都付。
      schema:
        type: boolean
        default: false

    SearchQuery:
      name: q
      in: query
      required: false
      description: 模糊搜索关键词
      schema:
        type: string
        maxLength: 128

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端生成的 UUID。载荷相同 → 返回原结果；载荷不同 → 409 `STATE_IDEMPOTENCY_MISMATCH`。
        存储 `idempotency_keys(key, user_id, request_hash, response_status, response_body, created_at)`，
        TTL 24 小时，`(key, user_id)` 唯一。
      schema:
        type: string
        minLength: 8
        maxLength: 128

    TotpCodeHeader:
      name: X-TOTP-Code
      in: header
      required: false
      description: TOTP 一次性码（6 位）。
      schema:
        type: string
        pattern: '^[0-9]{6}$'

    TotpCodeHeaderRequired:
      name: X-TOTP-Code
      in: header
      required: true
      description: |
        **L3 step-up：该操作必须带当次 TOTP。** 同一 code **5 分钟内只能用一次**（防重放，需 `used_totp` 表）。
        缺失 → 403 `AUTH_TOTP_REQUIRED`；错误或已用过 → 403 `AUTH_TOTP_INVALID`。
      schema:
        type: string
        pattern: '^[0-9]{6}$'

  headers:
    ETag:
      description: |
        版本号驱动，**不是哈希响应体**。形状 `W/"<node_id>-c<config_rev>"`（`/config`）
        或 `W/"<node_id>-u<user_rev>"`（`/user`）——
        **两个端点用不同的 ETag**，否则改配置会让用户列表也失效，反之亦然。
        判定路径是一次主键查询 `SELECT config_rev, user_rev FROM servers WHERE id = $1`（< 1 ms）。
      schema:
        type: string
      example: W/"3-u482"

    CacheControlNoCache:
      description: '固定 `no-cache`。304 响应也必须带（ADR 0006 §11.3）。'
      schema:
        type: string
      example: no-cache

    XRequestId:
      description: 本次请求的 ULID，等于响应体 `meta.request_id`。用户报障时直接贴这个串。
      schema:
        type: string
      example: 01K2VQ7C9M0000000000000000

    RetryAfter:
      description: 退避秒数。**429 与 503 必带。**
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 60

    Location:
      description: 新建资源的 URL（201 必带）。
      schema:
        type: string

    SubscriptionUserinfo:
      description: |
        照抄 Xboard `app/Protocols/General.php`：
        `upload={u}; download={d}; total={transfer_enable}; expire={expired_at}`

        - 分隔符是 `; `（**分号 + 一个空格**）
        - 值全部是十进制整数，**无引号、无单位后缀**
        - `upload` / `download` / `total` 单位**字节**；`expire` 是 **Unix 秒**（§2.5 的例外之一）
        - 头名全小写（HTTP 头不区分大小写，照抄 Xboard）

        > ⚠️ **不限时套餐（`expired_at IS NULL`）时 `expire` 写什么 未实测。**
        > Xboard 输出空值（`expire=`），已知风险是部分客户端把空值当 0 处理并显示「1970-01-01 已过期」。
        > **提案（未验证）**：输出远期时间戳 `4102444800`（2100-01-01T00:00:00Z），
        > 把「客户端可能渲染错」换成「显示 2100 年到期」的确定行为。**必须实测后再定。**
      schema:
        type: string
      example: upload=1048576; download=10485760; total=107374182400; expire=1788240000

    ProfileUpdateInterval:
      description: 客户端自动更新间隔，单位**小时**。
      schema:
        type: integer
        format: int32
      example: 24

    ProfileWebPageUrl:
      description: 客户端「访问网站」按钮指向的 URL。
      schema:
        type: string
      example: https://web.babel.plus/subscribe

    ContentDisposition:
      description: '固定 `attachment; filename*=UTF-8''''babel.plus` —— 决定客户端里显示的订阅名。'
      schema:
        type: string

    CacheControlNoStore:
      description: '固定 `no-store`。订阅内容内嵌当前用量数字，不设 ETag、不许缓存。'
      schema:
        type: string
      example: no-store

  responses:
    NodeNotModified:
      description: |
        **ETag 命中。** 节点必须复用本地配置，不做任何 reload。
        304 必须回带 `ETag` 与 `Cache-Control: no-cache`。**无 body。**
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoCache'

    NodeAck:
      description: |
        **冻结形状 `{"data": true}`。**

        > ⚠️ Xboard 的 `/push` 响应体形状在调研中未记录，**v2node 是否解析它 需实测**。
        > 若 v2node 只看状态码，本字段无意义但无害；若它解析，必须与 Xboard 逐字节一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeAck'

    NodeBadRequest:
      description: JSON 解析失败或形状不合法（**裸 JSON，不套信封**）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeError'

    NodeUnauthorized:
      description: |
        `NODE_KEY_INVALID` —— 密钥无效 / 已吊销 / 已过期。

        **节点必须继续用最后一次成功的配置转发，指数退避重试。**

        > 🔴 这一条**我们无法通过契约强制** —— 它取决于 v2node 的实现。
        > 「v2node 收到 401 是否清空用户列表」是动工前必测的三项之一：
        > 若它清空，一次密钥配置失误 = 全体用户瞬时掉线，且现象与 IP 级封锁高度相似。
        > 这是整份契约里唯一一条「实现方不是我们、后果却由我们承担」的条款。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeError'

    NodeForbidden:
      description: |
        `NODE_SCOPE_DENIED`（密钥 scope 不含该路由）或
        `NODE_ID_MISMATCH`（请求带的 `node_id` 与密钥绑定的不一致）。两者都**写告警**。
        节点行为同 401：继续用最后一次成功的配置转发。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeError'

    NodeRateLimited:
      description: '`QUOTA_RATE_LIMITED` —— per `node_id` 30 req/min（正常 1/min，给 30 倍余量）。节点按 `Retry-After` 退避。'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeError'

    NodeInternalError:
      description: |
        面板故障。**节点行为同 401 —— 绝不能停止转发。**

        > `system-design.md` §5.3 是硬约束：**控制面故障绝不能升级为数据面故障。**
        > 节点在拉取失败时使用最后一次成功的配置继续服务，并本地缓冲流量数据待恢复后补报。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NodeError'

    SubscriptionPayload:
      description: |
        订阅内容。**三种格式按 `User-Agent` 分发**（匹配不区分大小写，**按表内顺序取第一个命中**）：

        | # | UA 子串 | 格式 | Content-Type |
        |---|---|---|---|
        | 1 | `clash-verge` / `clash.meta` / `mihomo` / `clash` | Clash/mihomo YAML | `text/yaml; charset=utf-8` |
        | 2 | `sing-box` / `SFI` / `SFA` / `SFM` / `SFT` | sing-box JSON | `application/json; charset=utf-8` |
        | 3 | `karing` | sing-box JSON | 同上 |
        | 4 | `hiddify` | sing-box JSON | 同上 |
        | 5 | `v2rayn` / `v2rayng` / `shadowrocket` | base64 分享链接 | `text/plain; charset=utf-8` |
        | 6 | *（未匹配）* | base64 分享链接 | `text/plain; charset=utf-8` |

        > ⚠️ **UA 子串表 需实测**：各客户端的实际 UA 必须逐个抓取确认，不能靠推断。
        > 这张表错一行，对应客户端的用户就会拿到 base64 而不是 YAML ——
        > 现象是「导入后没有分组，只有一堆裸节点」。

        **明确不做的格式**：Surge / Surfboard / QuantumultX / Loon / Stash / SSR。

        到期 / 配额耗尽 / 封禁 → 仍是 200，但**节点列表为空 + 一个伪节点**：

        | 状态 | 伪节点名 |
        |---|---|
        | 到期 | `⚠️ 订阅已到期 · 续费 <web 域名>` |
        | 配额耗尽 | `⚠️ 流量已用尽 · 购买流量包 <web 域名>` |
        | 封禁 | `⚠️ 账号已停用 · 请提交工单 <web 域名>` |

        伪节点必须是**语法合法但连不上**的条目（例如指向 `127.0.0.1:1`），
        否则部分客户端会因为「proxies 为空」拒绝导入整份配置，用户连这句话都看不到。
        域名广播时列表第一位保留给广播位。

        > ⚠️ **待核实**：各客户端对节点名长度与特殊字符（emoji、空格、`·`、冒号）的渲染差异。
      headers:
        subscription-userinfo:
          $ref: '#/components/headers/SubscriptionUserinfo'
        profile-update-interval:
          $ref: '#/components/headers/ProfileUpdateInterval'
        profile-web-page-url:
          $ref: '#/components/headers/ProfileWebPageUrl'
        content-disposition:
          $ref: '#/components/headers/ContentDisposition'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
        x-request-id:
          $ref: '#/components/headers/XRequestId'
      content:
        text/yaml:
          schema:
            type: string
            description: |
              Clash / mihomo YAML。两条与既定裁决的直接对应：
              **TCP 路径有 `smux`、UDP 路径没有**（TCP 路径启用 mux 抗 TLS-in-TLS 指纹）；
              **默认组是 `fallback` 不是 `url-test`**（各健康节点延迟同在 100–250 ms 噪声带内，
              吞吐却差 4–5 倍，`url-test` 会稳定选错），另给一个 `select` 类型的「加速」组。

              > ⚠️ **字段名 需实测**：mihomo 的 vless `smux` 块字段名、`reality-opts` 的键名、
              > hysteria2 的 `obfs-password` 拼写，全部必须用真实 Clash Verge Rev 加载 golden file 验证。
              > ADR 0006 §12 已把这条定为**不可自动化的人工步骤**。
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: |
              sing-box JSON。加分做法（ADR 0006 §5.1）：Go 侧直接 `import` sing-box 的配置结构体
              反序列化我们的输出，让「生成了 sing-box 不认的 JSON」在编译期之后的第一个测试就暴露，
              而不是在用户的手机上。
        text/plain:
          schema:
            type: string
            description: |
              若干行分享链接的整体 base64（标准 base64，带填充，无换行）。
              解码后每行形如 `vless://…#HK-1%20%C2%B7%20REALITY`、`hysteria2://…`。

    SubscriptionNotFound:
      description: |
        **token 不存在 / 已吊销 / `issued_at < users.sub_revoked_at` —— 一律 404，不是 403。**
        403 会告诉攻击者「这个 token 存在但你不能用」（ADR 0006 §10.2）。

        注意：**banned / 到期 / 配额耗尽不走这里**，它们是 200 + 空列表 + 伪节点。
      content:
        text/plain:
          schema:
            type: string

    ErrBadRequest:
      description: '`VALIDATION_MALFORMED_BODY` —— JSON 解析失败。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrUnauthorized:
      description: '未认证或凭据无效（`AUTH_*` / `PAYMENT_SIGNATURE_INVALID`）。**不要用来表示「已登录但没权限」——那是 403。**'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrForbidden:
      description: '已认证但被拒（`AUTH_PERMISSION_DENIED` / `AUTH_TOTP_REQUIRED` / `AUTH_TOTP_INVALID` / `QUOTA_DEVICE_LIMIT`）。**不要用来表示「资源不存在」——那是 404。**'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrNotFound:
      description: '`RESOURCE_NOT_FOUND` —— 不存在，**或存在但不该让你知道存在**。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrConflict:
      description: '`STATE_CONFLICT` / `STATE_IDEMPOTENCY_MISMATCH` / `PAYMENT_ORDER_EXPIRED` —— 状态机冲突或幂等键冲突。**不要用来表示校验失败 —— 那是 422。**'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrUnprocessable:
      description: '`VALIDATION_FAILED` —— 语义校验失败，`details` 逐字段列出。**不要用来表示 JSON 语法错 —— 那是 400。**'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrRateLimited:
      description: '`QUOTA_RATE_LIMITED` —— 限流，**必带 `Retry-After`**。'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrInternal:
      description: '`INTERNAL_ERROR` —— 兜底。**message 不含任何内部细节**，只给 `request_id`。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ErrDependencyDown:
      description: '`INTERNAL_DEPENDENCY_DOWN` —— DB / 支付网关不可达，**必带 `Retry-After`**。'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    InternalTaskAck:
      description: |
        任务已处理（**含幂等丢弃** —— Cloud Tasks 是 at-least-once，
        重复投递是常态不是异常，每个 handler 都要有表驱动的幂等测试）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalTaskAck'

  schemas:

    Meta:
      type: object
      description: |
        信封的 `meta`。**`request_id` 必然存在（含 5xx）**，值等于响应头 `X-Request-Id`。
        分页三字段只在列表端点出现；`total` 只在管理面传了 `?count=true` 时出现。
      required: [request_id]
      properties:
        request_id:
          type: string
          description: ULID，用户报障时直接贴这个串
        next_cursor:
          type: string
          description: 下一页游标。**无更多数据时为 `null`。**
        has_more:
          type: boolean
          description: 是否还有下一页。无更多数据时为 `false`。
        total:
          type: integer
          format: int64
          description: 总条数。**仅管理面 `?count=true` 时返回**，用户面永不返回。

    ErrorCode:
      type: string
      description: |
        **字符串常量而非数字。** 数字码要维护一张人脑对照表，且在日志里 `grep 1042` 会命中一堆无关行。
        **新增码必须先进本 enum**（api-contract.md §12）。

        `message` 是给人看的中文，`code` 是给程序看的英文常量 —— **前端禁止匹配 `message` 做分支。**
      enum:
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_TOKEN_INVALID
        - AUTH_TOTP_REQUIRED
        - AUTH_TOTP_INVALID
        - AUTH_PERMISSION_DENIED
        - VALIDATION_FAILED
        - VALIDATION_MALFORMED_BODY
        - RESOURCE_NOT_FOUND
        - STATE_CONFLICT
        - STATE_IDEMPOTENCY_MISMATCH
        - QUOTA_RATE_LIMITED
        - QUOTA_DEVICE_LIMIT
        - PAYMENT_UNDERPAID
        - PAYMENT_ORDER_EXPIRED
        - PAYMENT_SIGNATURE_INVALID
        - NODE_KEY_INVALID
        - NODE_SCOPE_DENIED
        - NODE_ID_MISMATCH
        - INTERNAL_ERROR
        - INTERNAL_DEPENDENCY_DOWN

    ErrorDetail:
      type: object
      description: 字段级错误明细，`VALIDATION_FAILED` 时逐字段列出。
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 给人看的中文。**5xx 时不含任何内部细节。**
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorEnvelope:
      type: object
      description: |
        失败信封。**`data` 与 `error` 互斥，永不同时出现。**
        **信封里不放 `status` 或 `success` 字段** —— HTTP 状态码是唯一权威
        （`{"status":"success"}` 配 HTTP 500 这种两个事实源的形态是 v2board 系的反模式，不抄）。
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/Meta'

    NodeError:
      type: object
      description: |
        **节点面的错误形状，不套统一信封**（v2node 用 Go 结构体直接反序列化，包一层 `{"data":…}` 立刻不兼容）。
        实践上 v2node 很可能只看 HTTP 状态码。
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'

    NodeAck:
      type: object
      description: '**冻结形状。** `/push` 与 `/alive` 的响应体固定为 `{"data": true}`。'
      required: [data]
      properties:
        data:
          type: boolean

    NodeBaseConfig:
      type: object
      description: v2node 的 `BaseConfig` 块。
      additionalProperties: true
      properties:
        push_interval:
          type: integer
          format: int32
          description: '上报间隔（秒）。照抄 Xboard 默认 **固定 60** —— 这就是请求量算术的输入。'
        pull_interval:
          type: integer
          format: int32
          description: 拉取间隔（秒），固定 60。
        device_online_min_traffic:
          type: integer
          format: int64
          description: |
            ⚠️ **值需实测才能定** —— v2node 会读它，但**单位与语义在调研中未确认**（api-contract.md §14）。
        node_report_min_traffic:
          type: integer
          format: int64
          description: ⚠️ 同上，**需实测**。

    NodeTlsSettings:
      type: object
      description: |
        REALITY / TLS 参数，照抄 Xboard `buildNodeConfig()`。**不改名、不改类型。**
      additionalProperties: true
      properties:
        server_name:
          type: string
        private_key:
          type: string
          description: '**REALITY x25519 私钥。** 凭据不落盘、不进仓库，来源是 Secret Manager。'
        short_id:
          type: string
        dest:
          type: string
        xver:
          type: string

    NodeConfig:
      type: object
      description: |
        **冻结契约：裸对象，不套信封。** 字段随 `protocol` 分支不同而不同（VLESS+REALITY / Hysteria2 …），
        因此全部 optional 且允许附加字段。

        **新增字段的规则**：我们自己需要的字段一律加在顶层新键，且**必须做到「v2node 忽略它也能正常工作」**
        （Go 的 `encoding/json` 默认忽略未知字段，但仍需在契约测试里断言）。
        任何「节点必须理解才能工作」的新字段 = 破坏性变更。

        > 🔴 **必须显式记录的缺口**：已裁定「证书必须钉 Let's Encrypt，禁用 Google Trust Services」，
        > 但 Xboard 的 hysteria 分支**是否有证书相关字段，调研中没有记录 —— 需核实**。
        > 若契约里没有位置，证书只能在装机脚本层面固定（certbot + LE），不经 `/config` 下发 ——
        > 两者的 runbook 完全不同。
      additionalProperties: true
      properties:
        protocol:
          type: string
          description: '`vless` / `hysteria` / `shadowsocks` …'
        version:
          type: integer
          format: int32
          description: Hysteria 分支用（`2`）。
        listen_ip:
          type: string
        server_port:
          type: integer
          format: int32
        network:
          type: string
        networkSettings:
          type: object
          additionalProperties: true
          description: '照抄 Xboard 的驼峰键名 —— **不改名**，即使它与周围的蛇形命名不一致。'
        tls:
          type: integer
          format: int32
          description: '`0` 无 / `1` TLS / `2` REALITY'
        flow:
          type: string
          description: 例 `xtls-rprx-vision`
        tls_settings:
          $ref: '#/components/schemas/NodeTlsSettings'
        up_mbps:
          type: integer
          format: int32
          description: |
            🔴 **Hysteria 分支必须下发 `0`。** 这与 `down_mbps` 正是 **Brutal 拥塞控制的参数**，
            已裁定「Hysteria2 用 BBR 不用 Brutal」，所以必须下发 0（= 不声明带宽 = 不启用 Brutal）。
            **v2node 对 0 的处理 需实测。**
        down_mbps:
          type: integer
          format: int32
          description: 🔴 同 `up_mbps`，必须下发 `0`。
        obfs:
          type: string
          description: 例 `salamander`
        obfs-password:
          type: string
          description: '照抄 Xboard 的连字符键名 —— **不改名**。'
        server_name:
          type: string
        base_config:
          $ref: '#/components/schemas/NodeBaseConfig'

    NodeUser:
      type: object
      description: 照抄 Xboard `getAvailableUsers` 的输出形状。
      required: [id, uuid, speed_limit, device_limit]
      properties:
        id:
          type: integer
          format: int64
          description: '用户主键。**`/push` 与 `/alive` 的 key 就是它。**'
        uuid:
          type: string
          description: 'VLESS 的 UUID；SS-2022 侧 XrayR 系直接把它当 password 用。**与订阅 token 无关。**'
        speed_limit:
          type: integer
          format: int32
          description: 'Mbps，0 = 不限。**第一阶段全部 0** —— 定价用设备数做杠杆，不用限速。'
        device_limit:
          type: integer
          format: int32
          description: 设备数上限，2 / 5 / 10 三档。

    NodeUserList:
      type: object
      description: |
        **冻结形状 `{"users":[…]}`。**

        响应体量级：200 用户 × 约 85 字节 ≈ 17 KB。若无 ETag：
        8 节点 × 1440 次/天 × 17 KB ≈ **196 MB/天出网 + 11,520 次全量查询/天**。
        有 ETag 后两者都趋近 0 —— 这就是 ETag 被称为「性能命门」的具体数字。

        > **代价**（§13）：冻结契约 = **放弃增量下发**，`/user` 只能全量。
        > **这个取舍在用户数 > 2000 或节点数 > 20 时不再成立。**
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/NodeUser'

    NodeTrafficPushRequest:
      type: object
      description: |
        `{uid: [upload, download]}`。key 是用户 id 的**字符串**，value 是长度**恰为 2** 的非负整数数组，
        单位**字节**，语义是**增量**（自节点上次成功上报以来）。
      additionalProperties:
        type: array
        description: '`[upload, download]`，单位字节'
        minItems: 2
        maxItems: 2
        items:
          type: integer
          format: int64
          minimum: 0

    NodeAlivePushRequest:
      type: object
      description: '`{uid: [ip, …]}`。**按 IP 计不是按设备计** —— 口径必须原样承认。'
      additionalProperties:
        type: array
        items:
          type: string
          description: 设备来源 IP

    NodeAliveList:
      type: object
      description: '**冻结形状 `{"alive": {uid: count}}`。** 只含 `device_limit > 0` 的用户。'
      required: [alive]
      properties:
        alive:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0

    NodeResourceUsage:
      type: object
      required: [total, used]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        used:
          type: integer
          format: int64
          minimum: 0

    NodeStatusReport:
      type: object
      description: 校验规则与 Xboard 一致。
      required: [cpu, mem, swap, disk]
      properties:
        cpu:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            **本 spec 里唯一允许的浮点字段**（§2.6）。`numeric` 且 `0 ≤ cpu ≤ 100`。
        mem:
          $ref: '#/components/schemas/NodeResourceUsage'
        swap:
          $ref: '#/components/schemas/NodeResourceUsage'
        disk:
          $ref: '#/components/schemas/NodeResourceUsage'

    InternalTaskAck:
      type: object
      description: 内部面裸 JSON，不套信封。
      required: [ok]
      properties:
        ok:
          type: boolean
        idempotent_skip:
          type: boolean
          description: '`true` 表示这次是重复投递，已幂等丢弃。'

    TrafficBatchTaskRequest:
      type: object
      required: [batch_id]
      properties:
        batch_id:
          type: string
          description: '`/push` 入库时由**服务端**生成的批次 ID（ULID）。'

    MailSendTaskRequest:
      type: object
      required: [mail_queue_id]
      properties:
        mail_queue_id:
          type: integer
          format: int64

    SessionTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: 短期 access JWT，**15 分钟**。
        refresh_token:
          type: string
          description: refresh token，**30 天，一次性轮换**（用一次即失效）。
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int32
          description: access token 剩余秒数。

    RegisterRequest:
      type: object
      required: [invite_code, email, password, email_code]
      properties:
        invite_code:
          type: string
          description: '**邀请码必填。**'
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        email_code:
          type: string
          description: 邮件验证码

    EmailCodeRequest:
      type: object
      required: [email, scene]
      properties:
        email:
          type: string
          format: email
        scene:
          type: string
          enum: [register, reset_password, bind_email]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128

    InviteVerifyResult:
      type: object
      description: '**必须区分「无效」与「已用尽」** —— 两者的用户动作完全不同。'
      required: [valid, state]
      properties:
        valid:
          type: boolean
        state:
          type: string
          enum: [ok, invalid, exhausted]

    TotpEnrollment:
      type: object
      description: '`secret` 明文只在此响应里出现一次。'
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
        otpauth_url:
          type: string

    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    LockedBoolean:
      type: object
      description: 一个**只读为 `true`** 的开关：值给前端渲染，`locked` 与 `reason` 给前端解释为什么不能关。
      required: [value, locked, reason]
      properties:
        value:
          type: boolean
        locked:
          type: boolean
        reason:
          type: string

    NotificationPrefs:
      type: object
      required: [expire_remind, traffic_remind, service_broadcast]
      properties:
        expire_remind:
          type: boolean
        traffic_remind:
          type: boolean
        service_broadcast:
          $ref: '#/components/schemas/LockedBoolean'

    NotificationPrefsUpdate:
      type: object
      description: |
        **注意这里没有 `service_broadcast`。**
        生命线不能被用户关掉 —— 它在类型上就不可写，而不是「前端隐藏的开关」。
      properties:
        expire_remind:
          type: boolean
        traffic_remind:
          type: boolean
      additionalProperties: false

    SubscriptionSummary:
      type: object
      description: 用量与到期摘要。金额无、流量为字节、时间为 RFC3339。
      required: [upload_bytes, download_bytes, total_bytes, device_count, device_limit]
      properties:
        plan_name:
          type: string
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
          description: '= `transfer_enable`'
        expired_at:
          type: string
          format: date-time
          description: '`null` = 不限时套餐（`expired_at IS NULL` 天然支撑）。'
        reset_at:
          type: string
          format: date-time
        device_count:
          type: integer
          format: int32
        device_limit:
          type: integer
          format: int32

    CurrentUser:
      type: object
      required: [id, email, banned, balance_amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        banned:
          type: boolean
        balance_amount:
          type: integer
          format: int64
          description: 余额，**单位：分**。**仅可消费不可提现。**
        commission_balance_amount:
          type: integer
          format: int64
          description: 佣金余额，**单位：分**。
        totp_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        subscription:
          $ref: '#/components/schemas/SubscriptionSummary'

    SubscriptionUrls:
      type: object
      description: |
        三种格式的订阅 URL。**默认对外发 `short`** —— 短、无 query、不易被聊天软件截断。
      required: [short, long]
      properties:
        short:
          type: string
          description: '`https://<api 域名>/s/{token}`'
        long:
          type: string
          description: '`https://<api 域名>/api/v1/client/subscribe?token={token}`'
        clash:
          type: string
          description: '强制 Clash YAML（`?flag=clash`）'
        singbox:
          type: string
          description: '强制 sing-box JSON（`?flag=singbox`）'
        base64:
          type: string
          description: '强制 base64 分享链接（`?flag=base64`）'

    UserSubscription:
      type: object
      required: [urls, summary]
      properties:
        urls:
          $ref: '#/components/schemas/SubscriptionUrls'
        summary:
          $ref: '#/components/schemas/SubscriptionSummary'

    SubscriptionToken:
      type: object
      description: |
        订阅 token **独立成表**，可多条、可命名、可单独吊销。**DB 只存 `sha256` 哈希。**
      required: [id, name, created_at, masked]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 人写的备注，如「iPhone」「公司电脑」
        masked:
          type: string
          description: '打码后的 token（如 `a1b2…f9`）。**明文不在此返回。**'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    SubscriptionTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    SubscriptionTokenCreated:
      type: object
      description: '**`token` 明文只在这一个响应里出现一次**，之后无法再取回。'
      required: [id, name, token, subscribe_url, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          description: '**明文，只此一次。**'
        subscribe_url:
          type: string
        created_at:
          type: string
          format: date-time

    RevokeAllResult:
      type: object
      required: [revoked, sub_revoked_at]
      properties:
        revoked:
          type: integer
          format: int32
          description: 被吊销的 token 条数
        sub_revoked_at:
          type: string
          format: date-time

    SubscriptionFetchLogEntry:
      type: object
      description: 来自 `subscribe_log`（**同步写**，不异步）。
      required: [id, request_at, request_ip]
      properties:
        id:
          type: integer
          format: int64
        request_at:
          type: string
          format: date-time
        request_ip:
          type: string
        user_agent:
          type: string
        sub_token_id:
          type: integer
          format: int64
        sub_token_name:
          type: string
        format:
          type: string
          enum: [clash, singbox, base64]

    UserDevice:
      type: object
      description: 来自 `user_alive`（`UNLOGGED` 表）。**口径是按 IP 不是按设备。**
      required: [id, ip, last_seen_at]
      properties:
        id:
          type: integer
          format: int64
        ip:
          type: string
        node_id:
          type: integer
          format: int64
        node_name:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    KickDevicesResult:
      type: object
      description: '**必须携带生效延迟提示** —— 配置下发是 60 秒轮询，下线不是即时的。'
      required: [removed, effective_within_seconds]
      properties:
        removed:
          type: integer
          format: int32
        effective_within_seconds:
          type: integer
          format: int32
          description: 固定 60（节点轮询周期）。

    UsagePoint:
      type: object
      required: [date, upload_bytes, download_bytes]
      properties:
        date:
          type: string
          format: date
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64

    UsageSeries:
      type: object
      required: [range, points, total_upload_bytes, total_download_bytes]
      properties:
        range:
          type: string
          enum: [7d, 30d, 90d]
        points:
          type: array
          items:
            $ref: '#/components/schemas/UsagePoint'
        total_upload_bytes:
          type: integer
          format: int64
        total_download_bytes:
          type: integer
          format: int64

    UserNode:
      type: object
      required: [id, name, type, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        region:
          type: string
        type:
          type: string
          description: '`vless` / `hysteria` …（权威来源是 `servers.type`）'
        status:
          type: string
          enum: [online, degraded, offline]
        multiplier_e9:
          type: integer
          format: int64
          description: |
            倍率，定点整数，基数 **1e9**（`1e9` = 1.0 倍）。
            **第一阶段不引入倍率，但字段先留**（抄 Remnawave `consumption_multiplier BIGINT`）。

    DiagnoseCheck:
      type: object
      required: [key, ok]
      properties:
        key:
          type: string
          enum: [account_active, not_expired, traffic_left, device_under_limit]
        ok:
          type: boolean
        detail:
          type: object
          additionalProperties: true
          description: 各检查项自带的上下文，`null` 表示无附加信息。

    DiagnoseResult:
      type: object
      description: |
        四项检查覆盖「能拉到订阅但连不上」的绝大多数成因，而这四项用户在客户端里一个都看不到。
      required: [checks, data_delay_note]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DiagnoseCheck'
        subscription_last_fetched_at:
          type: string
          format: date-time
        traffic_last_reported_at:
          type: string
          format: date-time
        data_delay_note:
          type: string
          description: |
            **不是装饰。** 流量数字有三个天然不一致的口径（面板 / 客户端 `subscription-userinfo` / 邮件快照）。
            不写这一句，必然有用户拿客户端的数字质问面板的数字。

    PlanPrice:
      type: object
      required: [period, amount]
      properties:
        period:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly, two_yearly, three_yearly, onetime]
        amount:
          type: integer
          format: int64
          description: '**单位：分**（`currency: "CNY"`）。**不抄 2025-01 把套餐价改成「元」浮点的那次倒退。**'

    Plan:
      type: object
      required: [id, name, type, prices, transfer_enable_bytes, device_limit]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [period, traffic_pack]
          description: 周期套餐 / 流量包两类。
        description:
          type: string
        currency:
          type: string
          enum: [CNY]
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanPrice'
        transfer_enable_bytes:
          type: integer
          format: int64
        device_limit:
          type: integer
          format: int32
          description: 2 / 5 / 10 三档。**定价用设备数做杠杆，不用限速。**
        speed_limit_mbps:
          type: integer
          format: int32
          description: '**第一阶段全部 0（不限）。**'
        reset_traffic_method:
          type: string
          description: |
            ⚠️ **未对齐**（§14）：流量包与周期重置的相互作用 ——
            user-journey 建议「周期重置时保留流量包配额」，与 system-design §6.7 未对齐。
        visible:
          type: boolean
        sort:
          type: integer
          format: int32

    PlanUpsert:
      type: object
      description: '管理面创建/编辑套餐。形状是**清单不是契约**（§14）。'
      required: [name, type, prices, transfer_enable_bytes, device_limit, reason]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [period, traffic_pack]
        description:
          type: string
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanPrice'
        transfer_enable_bytes:
          type: integer
          format: int64
        device_limit:
          type: integer
          format: int32
        speed_limit_mbps:
          type: integer
          format: int32
        visible:
          type: boolean
        sort:
          type: integer
          format: int32
        reason:
          type: string
          minLength: 8
          description: 'L2：进审计日志。'

    OrderStatus:
      type: string
      enum: [pending, processing, completed, cancelled, expired, refunded]

    Order:
      type: object
      description: '**所有 `*_amount` 单位都是分。** 类型层面不给 float 留口子。'
      required: [trade_no, type, status, currency, total_amount, payable_amount, created_at]
      properties:
        trade_no:
          type: string
        type:
          type: string
          enum: [new, renew, upgrade, traffic_pack]
        status:
          $ref: '#/components/schemas/OrderStatus'
        plan_id:
          type: integer
          format: int64
        plan_name:
          type: string
        period:
          type: string
        currency:
          type: string
          enum: [CNY]
        total_amount:
          type: integer
          format: int64
          description: 原价，**单位：分**。
        discount_amount:
          type: integer
          format: int64
          description: 优惠金额，**单位：分**。
        surplus_amount:
          type: integer
          format: int64
          description: |
            升级折抵，**单位：分**。
            > ⚠️ **现在没有契约**（§14）：折抵算法（按剩余天数还是剩余流量）**未裁决**，
            > user-journey 只定了呈现口径（三行：原套餐剩余价值 / 新套餐价 / 实付）。
        balance_amount:
          type: integer
          format: int64
          description: 余额抵扣，**单位：分**。
        payable_amount:
          type: integer
          format: int64
          description: 实付，**单位：分**。
        rate_locked_at:
          type: string
          format: date-time
          description: 汇率锁定时刻。
        expires_at:
          type: string
          format: date-time
          description: |
            订单过期时刻（下单 + 30 分钟）。到点转 `expired`，
            **但该收款地址必须继续监听 ≥ 24 小时，期间到账入余额、不直接开通**。
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [plan_id, period]
      properties:
        plan_id:
          type: integer
          format: int64
        period:
          type: string
          enum: [monthly, quarterly, half_yearly, yearly, two_yearly, three_yearly, onetime]
        coupon_code:
          type: string
        use_balance:
          type: boolean
          default: false

    PayOrderRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [usdt_trc20, balance]

    PaymentState:
      type: string
      description: '**必须含 `underpaid`** —— 金额唯一性匹配决定了少付一定会发生。'
      enum: [waiting, confirming, underpaid, paid, expired]

    PaymentCheckout:
      type: object
      description: 收银台数据，对应 page-inventory §3.2.5 的六个必备元素。
      required: [trade_no, state]
      properties:
        trade_no:
          type: string
        chain:
          type: string
          enum: [TRC20]
        address:
          type: string
        amount_usdt6:
          type: integer
          format: int64
          description: |
            应付金额，**单位 1e-6 USDT**。**末位是订单识别码** ——
            「小地址池 + 金额唯一性」（抄 EPUSDT：冲突则 `+0.0001` 递增重试，最多 100 次；
            `+0.0001 USDT = +100 usdt6`）。
        amount_display:
          type: string
          description: 供展示的四位小数字符串（如 `5.8423`）。**展示用字符串，不是数值类型 —— 不给浮点留口子。**
        cny_per_usdt_e4:
          type: integer
          format: int64
          description: 锁定汇率，定点整数，基数 1e4。
        quote_expires_at:
          type: string
          format: date-time
        confirmations_required:
          type: integer
          format: int32
          description: |
            **必须可配置下发，不能硬编码在前端。**
            各链确认数策略待定稿：TRC20 等固化块（约 57 s）、ERC20 6 确认、BEP20 15 确认。
        received_usdt6:
          type: integer
          format: int64
        shortfall_usdt6:
          type: integer
          format: int64
          description: '`state = underpaid` 时的差额，前端显示「已收到 X，还差 Y」而不是笼统的「支付失败」。'
        state:
          $ref: '#/components/schemas/PaymentState'
        note:
          type: string
          description: |
            解释四位小数尾数的文案。**它的存在是因为 user-journey 列出的七个卡点里
            第三个就是「四位小数尾数像诈骗」—— 不解释这个尾数，用户会停在这一步。**

    CouponVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        plan_id:
          type: integer
          format: int64
        period:
          type: string

    CouponVerifyResult:
      type: object
      required: [code, valid]
      properties:
        code:
          type: string
        valid:
          type: boolean
        discount_amount:
          type: integer
          format: int64
          description: 抵扣金额，**单位：分**。
        type:
          type: string
          enum: [fixed, percent]
        reason:
          type: string
          description: 不可用时的中文原因。

    TicketCategory:
      type: string
      enum: [subscription, node-down, billing, account]

    TicketStatus:
      type: string
      enum: [open, pending, replied, closed]

    Ticket:
      type: object
      required: [public_id, subject, category, status, created_at]
      properties:
        public_id:
          type: string
        subject:
          type: string
        category:
          $ref: '#/components/schemas/TicketCategory'
        status:
          $ref: '#/components/schemas/TicketStatus'
        level:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_reply_at:
          type: string
          format: date-time

    TicketMessage:
      type: object
      description: |
        🔴 **用户面的工单消息类型里没有 `is_internal` 字段** —— 这是刻意的。
        `ticket_messages.is_internal` 是全系统最容易出安全事故的一列，
        **用户侧查询必须走固定带 `is_internal = false` 的视图或方法，不接受调用方传参决定**。
        让「泄漏内部备注」在生成的类型上就**不可表达**。
      required: [id, author, body, created_at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
          enum: [user, staff]
        body:
          type: string
        created_at:
          type: string
          format: date-time

    TicketDetail:
      type: object
      required: [ticket, messages]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'

    TicketClientContext:
      type: object
      description: |
        客户端自述的诊断快照。**服务端在建单时重新采集并覆盖**，
        客户端传的这份只作为「客户端自己看到的状态」存进 `context.client_reported`。
        理由：工单记录的是「报障当时的事实」，而客户端的自述可能已经过时或被篡改。
      additionalProperties: true
      properties:
        plan_name:
          type: string
        expired_at:
          type: string
          format: date-time
        used_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        device_count:
          type: integer
          format: int32
        device_limit:
          type: integer
          format: int32
        last_sub_fetch_at:
          type: string
          format: date-time
        last_sub_fetch_ip:
          type: string
        last_sub_fetch_ua:
          type: string
        last_active_node:
          type: string

    CreateTicketRequest:
      type: object
      required: [category, subject, message]
      properties:
        category:
          $ref: '#/components/schemas/TicketCategory'
        subject:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
        context:
          $ref: '#/components/schemas/TicketClientContext'

    CreateTicketMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    Notice:
      type: object
      required: [id, title, content, published_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        pinned:
          type: boolean
        published_at:
          type: string
          format: date-time

    NoticeUpsert:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        pinned:
          type: boolean
        published_at:
          type: string
          format: date-time

    InviteCode:
      type: object
      required: [id, code, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        status:
          type: string
          enum: [ok, exhausted, disabled]
        invite_url:
          type: string
        used_count:
          type: integer
          format: int32
        use_limit:
          type: integer
          format: int32
          description: '0 = 不限'
        created_at:
          type: string
          format: date-time

    AdminInviteCreateRequest:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        use_limit:
          type: integer
          format: int32
        note:
          type: string

    Commission:
      type: object
      required: [id, amount, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        order_trade_no:
          type: string
        amount:
          type: integer
          format: int64
          description: 佣金金额，**单位：分**。
        status:
          type: string
          enum: [pending, confirmed, settled]
          description: '`确认中` / `已获得` 两段式。转换的触发方与冷静期**未裁决**（§14）。'
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time

    CommissionTransferRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: 划转金额，**单位：分**。**佣金只能划转到余额，不可提现。**

    CommissionAdjustRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: integer
          format: int64
          description: 调整额，**单位：分**，可为负。
        reason:
          type: string
          minLength: 8

    Wallet:
      type: object
      required: [balance_amount, commission_pending_amount, commission_available_amount]
      properties:
        balance_amount:
          type: integer
          format: int64
          description: 余额，**单位：分**。**仅可消费不可提现**（product-brief §6）。
        commission_pending_amount:
          type: integer
          format: int64
          description: 确认中的佣金，**单位：分**。
        commission_available_amount:
          type: integer
          format: int64
          description: 已获得可划转的佣金，**单位：分**。

    WalletTransaction:
      type: object
      required: [id, type, amount, balance_after, created_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [recharge, consume, refund, commission_transfer, admin_adjust, expired_order_credit]
        amount:
          type: integer
          format: int64
          description: 变动额，**单位：分**，可为负。
        balance_after:
          type: integer
          format: int64
          description: 变动后余额，**单位：分**。
        note:
          type: string
        created_at:
          type: string
          format: date-time

    ReasonRequest:
      type: object
      description: '**L2 必填原因**：`reason` ≥ 8 字符，与业务写入同事务进 `admin_audit_log`。'
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8

    ConfirmedReasonRequest:
      type: object
      description: |
        **L1 确认串 + L2 必填原因。**
        `confirmation` 的期望值由**服务端**查出（用户邮箱 / 节点名 / 管理员邮箱），常数时间比对，不一致 → 422。
        **L1 必须在 API 层，不能在前端** —— 前端的确认弹窗对一个直接 `curl` 的人是零。
      required: [confirmation, reason]
      properties:
        confirmation:
          type: string
        reason:
          type: string
          minLength: 8

    MarkPaidRequest:
      type: object
      description: '**D6 · 全系统最大的内部欺诈面。** L1 + L2 + L3 + L4 四层全开。'
      required: [confirmation, reason]
      properties:
        confirmation:
          type: string
          description: 必须等于**订单所属用户的邮箱**。
        reason:
          type: string
          minLength: 8
        evidence_url:
          type: string
          description: 链上交易或网关凭证的 URL，进审计日志。

    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8
        amount:
          type: integer
          format: int64
          description: 退款金额，**单位：分**。缺省为全额。

    BalanceAdjustRequest:
      type: object
      required: [confirmation, reason, amount]
      properties:
        confirmation:
          type: string
          description: 必须等于该用户的邮箱。
        reason:
          type: string
          minLength: 8
        amount:
          type: integer
          format: int64
          description: 调整额，**单位：分**，可为负。

    AdminUser:
      type: object
      required: [id, email, banned, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        banned:
          type: boolean
        balance_amount:
          type: integer
          format: int64
          description: '**单位：分**'
        plan_name:
          type: string
        expired_at:
          type: string
          format: date-time
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64
        transfer_enable_bytes:
          type: integer
          format: int64
        device_limit:
          type: integer
          format: int32
        group_id:
          type: integer
          format: int64
        sub_revoked_at:
          type: string
          format: date-time
        invited_by_user_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    AdminUserPatch:
      type: object
      description: '**D1：L2 必填原因。** 改变可见用户集合的字段会 bump 相关节点的 `user_rev`。'
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8
        expired_at:
          type: string
          format: date-time
        transfer_enable_bytes:
          type: integer
          format: int64
        device_limit:
          type: integer
          format: int32
        group_id:
          type: integer
          format: int64
        uuid:
          type: string
          description: 换 uuid 会 bump `user_rev`。

    AdminOrder:
      type: object
      required: [order, user_id, user_email]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        user_id:
          type: integer
          format: int64
        user_email:
          type: string
          format: email

    AdminNode:
      type: object
      description: |
        对应 `servers` 表。`config_rev` / `user_rev` 是 ETag 的版本源
        （**本文取 `servers.config_rev` / `servers.user_rev`**：ADR 0005 的存储形态 + ADR 0006 的列名；
        这处命名冲突需在 `data-model.md` 落定）。
      required: [id, name, type, enabled]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          description: '**节点类型的权威来源**（不是请求里的 `node_type`）。'
        host:
          type: string
        port:
          type: integer
          format: int32
        region:
          type: string
        enabled:
          type: boolean
        group_ids:
          type: array
          items:
            type: integer
            format: int64
        multiplier_e9:
          type: integer
          format: int64
          description: 倍率，基数 1e9。第一阶段不引入，字段先留。
        config_rev:
          type: integer
          format: int64
        user_rev:
          type: integer
          format: int64
        last_push_at:
          type: string
          format: date-time
        last_status_at:
          type: string
          format: date-time
        load_status:
          $ref: '#/components/schemas/NodeStatusReport'

    AdminNodeUpsert:
      type: object
      description: '**形状是清单不是契约**（§14）。写操作会 bump `config_rev`。'
      required: [name, type, reason]
      properties:
        name:
          type: string
        type:
          type: string
        host:
          type: string
        port:
          type: integer
          format: int32
        region:
          type: string
        enabled:
          type: boolean
        group_ids:
          type: array
          items:
            type: integer
            format: int64
        multiplier_e9:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 8

    NodeScope:
      type: string
      description: '**精确匹配，非前缀。** 白名单是 Go 里的常量 map，不从 DB 读。'
      enum:
        - node:config:read
        - node:users:read
        - node:traffic:write
        - node:alive:write
        - node:alive:read
        - node:status:write

    NodeKey:
      type: object
      description: '**任何响应都不返回 `secret` 明文**（`createAdminNodeKey` 的 201 除外，且只此一次）。'
      required: [id, key_id, name, scopes, created_at]
      properties:
        id:
          type: integer
          format: int64
        key_id:
          type: string
          description: base32 六字符短标识。**存在的唯一目的是让服务端一次主键查询定位到行。**
        name:
          type: string
          description: 人写的备注，如「2026-08 轮换」
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/NodeScope'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: '**D5 两步轮换的判据**：观察到新 `key_id` 出现在这里，才允许吊销旧密钥。'
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    NodeKeyCreateRequest:
      type: object
      description: |
        **注意这里没有任何「自定义密钥」字段。**
        `secret_hash` 用 SHA-256 的取舍成立的前提就是「密钥是 256 位 CSPRNG，不是人设的」——
        一旦允许人工设定，这条取舍立刻失效。
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          description: 缺省为默认五个（不含 `node:status:write`）。
          items:
            $ref: '#/components/schemas/NodeScope'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    NodeKeyCreated:
      type: object
      description: '`secret` 是完整的 `bpn_<key_id>_<secret>` 串，**明文只在此出现一次**。'
      required: [key, secret]
      properties:
        key:
          $ref: '#/components/schemas/NodeKey'
        secret:
          type: string
          description: '**明文，只此一次。** 形如 `bpn_7f3a2c_kQ2mXv9pL4nR8tZ1wY6bC3dF5gH7jK0sA2eU4iO6`。'

    StatBucket:
      type: object
      required: [record_at, upload_bytes, download_bytes]
      properties:
        record_at:
          type: string
          format: date-time
        user_id:
          type: integer
          format: int64
        server_id:
          type: integer
          format: int64
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64

    AdminDashboard:
      type: object
      description: '**形状是清单不是契约**（§14）：后台前端框架未裁决前不冻结。'
      properties:
        online_users:
          type: integer
          format: int64
        active_nodes:
          type: integer
          format: int32
        total_nodes:
          type: integer
          format: int32
        today_upload_bytes:
          type: integer
          format: int64
        today_download_bytes:
          type: integer
          format: int64
        today_revenue_amount:
          type: integer
          format: int64
          description: '**单位：分**'
        month_revenue_amount:
          type: integer
          format: int64
          description: '**单位：分**'
        pending_tickets:
          type: integer
          format: int32
        underpaid_orders:
          type: integer
          format: int32

    AdminTicketMessage:
      type: object
      description: '**管理面独有 `is_internal`。** 用户面的 `TicketMessage` 上没有这个字段。'
      required: [id, author, body, is_internal, created_at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: string
          enum: [user, staff]
        body:
          type: string
        is_internal:
          type: boolean
        created_at:
          type: string
          format: date-time

    AdminTicketDetail:
      type: object
      required: [ticket, messages, user_id, user_email]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AdminTicketMessage'
        user_id:
          type: integer
          format: int64
        user_email:
          type: string
          format: email
        context:
          type: object
          additionalProperties: true
          description: 服务端在建单时采集的诊断快照（含 `client_reported` 子对象）。

    AdminCreateTicketMessageRequest:
      type: object
      required: [message, is_internal]
      properties:
        message:
          type: string
          minLength: 1
        is_internal:
          type: boolean
          description: '`true` = 内部备注，**永远不会出现在用户面的响应里**。'

    AdminTicketPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        level:
          type: integer
          format: int32

    AuditLogEntry:
      type: object
      description: |
        对应 `admin_audit_log`。**`before` / `after` 存变更字段的完整快照，不存 diff**
        （diff 需要靠对面的数据重建，而对面的数据可能已经被改了三次）。
      required: [id, admin_id, request_id, ip, action, target_type, target_id, created_at]
      properties:
        id:
          type: integer
          format: int64
        admin_id:
          type: integer
          format: int64
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        action:
          type: string
          description: 例 `order.mark_paid`
        target_type:
          type: string
          description: 例 `order`
        target_id:
          type: string
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    AdminPermission:
      type: string
      description: '`admin.order.mark_paid` 与 `admin.user.export` **默认不授予，即使团队只有一个人**。'
      enum:
        - admin.order.mark_paid
        - admin.user.export
        - admin.user.write
        - admin.node.write
        - admin.plan.write
        - admin.ticket.write
        - admin.settings.write

    AdminAccount:
      type: object
      required: [id, email, permissions, totp_enabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermission'
        totp_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    AdminAccountCreateRequest:
      type: object
      required: [email, reason]
      properties:
        email:
          type: string
          format: email
        permissions:
          type: array
          description: 缺省为空 —— **默认不授予任何危险权限位**。
          items:
            $ref: '#/components/schemas/AdminPermission'
        reason:
          type: string
          minLength: 8

    Coupon:
      type: object
      required: [id, code, type, value, enabled]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        type:
          type: string
          enum: [fixed, percent]
        value:
          type: integer
          format: int64
          description: '`fixed` 时是**分**；`percent` 时是百分点整数（如 `20` = 8 折）。**不用浮点。**'
        enabled:
          type: boolean
        use_limit:
          type: integer
          format: int32
        used_count:
          type: integer
          format: int32
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        plan_ids:
          type: array
          items:
            type: integer
            format: int64

    CouponUpsert:
      type: object
      required: [code, type, value, reason]
      properties:
        code:
          type: string
        type:
          type: string
          enum: [fixed, percent]
        value:
          type: integer
          format: int64
        enabled:
          type: boolean
        use_limit:
          type: integer
          format: int32
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        plan_ids:
          type: array
          items:
            type: integer
            format: int64
        reason:
          type: string
          minLength: 8

    AdminPayment:
      type: object
      required: [id, provider, external_id, state, created_at]
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        external_id:
          type: string
          description: '**幂等键的一半**：`(provider, external_id)` 上有唯一索引。'
        trade_no:
          type: string
        state:
          $ref: '#/components/schemas/PaymentState'
        expected_usdt6:
          type: integer
          format: int64
        received_usdt6:
          type: integer
          format: int64
        shortfall_usdt6:
          type: integer
          format: int64
        txid:
          type: string
        created_at:
          type: string
          format: date-time

    AdminPaymentPatch:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 8
        state:
          $ref: '#/components/schemas/PaymentState'
        note:
          type: string

    ExportJob:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        download_url:
          type: string
        expires_at:
          type: string
          format: date-time

    MailTemplate:
      type: object
      required: [id, key, subject, body]
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        subject:
          type: string
        body:
          type: string
        enabled:
          type: boolean

    MailTemplatePatch:
      type: object
      required: [reason]
      properties:
        subject:
          type: string
        body:
          type: string
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 8

    MailLogEntry:
      type: object
      description: |
        兼 `email_probe` 的读取面：按收件域名分组统计送达率，
        直接充当 ADR 0002 §7 要求的**送达率实测数据源**。
      required: [id, recipient_domain, sent_at]
      properties:
        id:
          type: integer
          format: int64
        recipient_domain:
          type: string
        esp:
          type: string
        template_key:
          type: string
        bounce_code:
          type: string
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    MailBroadcastRequest:
      type: object
      description: |
        🔴 **收件人筛选表达式怎么表示是个独立的设计问题，尚未裁决**（§14）。
        本 schema 只有粗粒度的 `audience` + 可选 `plan_ids`；
        服务端对未实现的组合返回 501 并留 `// TODO(P1)`。
      required: [subject, body, audience, reason]
      properties:
        subject:
          type: string
        body:
          type: string
        audience:
          type: string
          enum: [all, active, expired, expiring_soon, by_plan]
        plan_ids:
          type: array
          items:
            type: integer
            format: int64
        reason:
          type: string
          minLength: 8

    MailBroadcastResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          format: int64
          description: 入队的收件人数。

    SettingsMap:
      type: object
      description: |
        系统配置键值对。**凭据不在这里** —— 一律走环境变量 / Secret Manager。
        **配置 fail-closed**：缺任何必需环境变量，服务直接退出，不生成半成品。
      additionalProperties: true

    SettingsPatchRequest:
      type: object
      required: [values, reason]
      properties:
        values:
          $ref: '#/components/schemas/SettingsMap'
        reason:
          type: string
          minLength: 8

    Domain:
      type: object
      required: [id, hostname, role, enabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        hostname:
          type: string
        role:
          type: string
          enum: [api, web, subscribe, admin]
        enabled:
          type: boolean
        last_checked_at:
          type: string
          format: date-time
          description: '⚠️ 可达性探活机制**尚不存在**，这个字段目前只能手工维护。'
        reachable:
          type: boolean
        created_at:
          type: string
          format: date-time

    DomainCreateRequest:
      type: object
      required: [hostname, role, reason]
      properties:
        hostname:
          type: string
        role:
          type: string
          enum: [api, web, subscribe, admin]
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 8
