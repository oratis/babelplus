  /api/v1/admin/nodes/{id}/keys:
    get:
      tags: [admin]
      operationId: listAdminNodeKeys
      summary: 节点密钥列表（模块 6）
      description: |
        一个节点可同时持有**多把有效密钥** —— 这是 D5（密钥两步轮换）能成立的前提。
        `secret_hash` 只在 DB 里，任何响应都**不返回明文**。
      security:
        - adminSession: []
          adminIap: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeKey'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '500':
          $ref: '#/components/responses/ErrInternal'
    post:
      tags: [admin]
      operationId: createAdminNodeKey
      summary: 签发节点密钥（**D5 第 1 步**，明文只在此响应里出现一次）
      description: |
        密钥形态 `bpn_<key_id>_<secret>`：`bpn_` 固定前缀（便于日志/代码扫描正则识别泄漏）、
        `key_id` 是 base32 六字符短标识（**存在的唯一目的是让服务端一次主键查询定位到行**）、
        `secret` 是 32 字节 CSPRNG base64url 无填充。

        `secret_hash` 用 **SHA-256 而不是 argon2id/bcrypt —— 这是有意的取舍**：
        慢哈希抵抗的是对低熵人类密码的离线爆破，这里是 256 位 CSPRNG 高熵密钥，离线爆破物理上不成立，
        而每 60 秒 × 节点数 × 5 端点都付一次 argon2 是纯损失。比对用 `subtle.ConstantTimeCompare`。
        **这条取舍在密钥改为人工可设时立刻失效 —— 所以 API 不提供「自定义密钥」入口**
        （请求体里没有任何写 secret 的字段）。

        默认签发 scope = `node:config:read` `node:users:read` `node:traffic:write`
        `node:alive:write` `node:alive:read`；`node:status:write` 按需。
      security:
        - adminSession: []
          adminIap: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/TotpCodeHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeKeyCreateRequest'
      responses:
        '201':
          description: 已签发（`secret` 明文只在此出现一次）
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/NodeKeyCreated'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '422':
          $ref: '#/components/responses/ErrUnprocessable'
        '500':
          $ref: '#/components/responses/ErrInternal'

  /api/v1/admin/node-keys/{key_id}:
    delete:
      tags: [admin]
      operationId: revokeAdminNodeKey
      summary: 吊销节点密钥（**D5 第 2 步，服务端强制两步**）
      description: |
        **服务端校验前置条件**：该节点必须存在另一把 `revoked_at IS NULL` 且
        `last_used_at > 新密钥签发时刻` 的密钥。不满足 → 409 `STATE_CONFLICT`，
        message 写明「新密钥尚未被节点使用过，现在吊销旧密钥会导致节点失联」。

        **UI 层禁止一步完成是不够的，API 层必须自己拒绝。**
      security:
        - adminSession: []
          adminIap: []
      parameters:
        - name: key_id
          in: path
          required: true
          description: '`node_keys.key_id`（base32 六字符）'
          schema:
            type: string
            pattern: '^[a-z2-7]{6}$'
        - $ref: '#/components/parameters/TotpCodeHeaderRequired'
      responses:
        '204':
          description: 已吊销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '403':
          $ref: '#/components/responses/ErrForbidden'
        '404':
          $ref: '#/components/responses/ErrNotFound'
        '409':
          $ref: '#/components/responses/ErrConflict'
        '500':
          $ref: '#/components/responses/ErrInternal'

