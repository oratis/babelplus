openapi: 3.1.0

info:
  title: babel.plus API
  version: 1.0.0-draft
  summary: 三个 API 面（node / client / user / admin / internal）的唯一契约事实源
  description: |
    本文件是 babel.plus 全仓的契约事实源（spec-first，ADR 0006 §9）。
    Go 侧由 `oapi-codegen` 生成 StrictServerInterface，TS 侧由 `openapi-typescript` +
    `openapi-fetch` 生成类型；CI 用 `git diff --exit-code` 卡生成物漂移。

    ## 五条互不共享的中间件链

    | 面 | tag | 路径前缀 | 鉴权 | 响应形状 |
    |---|---|---|---|---|
    | 节点面（**冻结契约**） | `node` | `/api/v1/server/UniProxy/*` | `nodeKey` | **裸 JSON，无信封** |
    | 订阅面（生态硬接口） | `client` | `/api/v1/client/subscribe`、`/s/{token}` | token 本身 | YAML / JSON / base64 |
    | 用户面 | `user` | `/api/v1/*` | `userSession` | 统一信封 |
    | 管理面 | `admin` | `/api/v1/admin/*` | `adminSession` + `adminIap` | 统一信封 |
    | 内部面 | `internal` | `/internal/tasks/*` | `internalOidc` | 裸 `{"ok":true}` |

    禁止「一个全局 auth 中间件 + 身份类型 if 分支」（ADR 0006 §10.3）。

    ## 统一响应信封（只适用于 user / admin 两面）

    成功 `{"data": …, "meta": {"request_id": "…"}}`；失败 `{"error": {"code","message","details"},"meta":{…}}`。
    `data` 与 `error` 互斥；信封里没有 `status` / `success` 字段，HTTP 状态码是唯一权威。
    `meta.request_id` 必然存在（含 5xx），值等于响应头 `X-Request-Id`。

    三处例外不套信封：`/api/v1/server/UniProxy/*`（裸 JSON，v2node 直接反序列化）、
    `/api/v1/client/subscribe`（`text/yaml` / `application/json` / `text/plain`）、`GET /healthz`（纯文本 `ok`）。

    ## 单位与类型约定

    - **金额一律 `integer` `format: int64`，单位「分」**（字段名 `*_amount`），另有 `currency: "CNY"`。
      **任何金额、流量、倍率都不得出现浮点。** 唯一允许浮点的是 `POST /status` 的 `cpu`。
    - USDT 金额单位 `1e-6 USDT`，字段名 `*_amount_usdt6`。
    - 流量单位字节，`integer` `format: int64`，字段名 `*_bytes`（UniProxy 面照抄 `u` / `d` / `transfer_enable`，不改名）。
    - 倍率定点整数，基数 `1e9`，字段名 `multiplier_e9`。
    - 时间一律 `string` `format: date-time`（RFC3339，UTC，带 `Z`），字段名以 `_at` 结尾。
      **三处例外必须是 Unix 秒整数**：UniProxy 面所有时间字段、`subscription-userinfo` 的 `expire=`、订阅内容体里的时间。

    ## 分页

    游标分页为默认：`?limit=20&cursor=<base64url>`。`limit` 默认 20 / 上限 100。
    `cursor` 是 base64url 的 `{"id":…,"at":"…"}`，**不签名**（它是位置不是凭据），但服务端必须校验解出的字段类型。
    总数默认不返回；管理面可传 `?count=true` 额外触发一次 `COUNT(*)`，用户面不提供。

    ## 节点面的三条冻结不变量（§11.2）

    1. 路径 `/api/v1/server/UniProxy/{config,user,push,alive,alivelist,status}`
    2. 凭据的传输位置：`Authorization` 头（过渡期允许 query，见 §3.2.4）
    3. 响应的顶层形状：`config` 是裸对象、`user` 是 `{"users":[…]}`、`push`/`alive` 是 `{"data":true}`

    允许的演进只有「加 optional 字段」，且必须做到 v2node 忽略它也能正常工作。

    > ⚠️ 管理面（tag `admin`）的请求/响应形状是**清单不是契约**（api-contract.md §14）：
    > 后台前端框架未裁决前不冻结。节点面与订阅面则相反 —— 它们由 v2node 与客户端生态定义，改动即破坏兼容。
  contact:
    name: babel.plus
    url: https://github.com/oratis/babelplus
  license:
    name: UNLICENSED
    url: https://github.com/oratis/babelplus

servers:
  - url: https://api.babel.plus
    description: |
      用户面 / 订阅面 / 节点面 / 支付回调。实际是一个**独立主域名 + 备用池**
      （system-design §4.1），此处仅为占位。
  - url: https://console.babelplus-ops.com
    description: |
      管理面。必须是**另一个独立主域名** + IAP/IP 白名单（page-inventory §4.1），
      不能是 api 域名的子域。此处仅为占位。

tags:
  - name: node
    description: |
      **节点面 · 冻结契约。** `/api/v1/server/UniProxy/*`，与 v2board 1.7.4 / Xboard 的
      UniProxy 端点逐字段兼容。响应是**裸 JSON**，禁止统一信封。
      这份面的正确性不由本仓库代码定义，而由 v2node 的实际行为定义。
  - name: client
    description: |
      **订阅面 · 生态硬接口。** 按 `User-Agent` 分发 Clash YAML / sing-box JSON / base64。
      不改版、不套信封、不设 ETag。
  - name: user
    description: '**用户面 · 我们的设计。** access JWT（15 分钟）+ refresh（30 天一次性轮换），统一信封。'
  - name: admin
    description: '**管理面 · 我们的设计。** 独立主域名 + IAP/IP 白名单 + 强制 TOTP，统一信封，同事务写审计。'
  - name: internal
    description: '**内部面。** 调用方是 Cloud Tasks / Pub-Sub push / Cloud Scheduler，凭据是 Google OIDC ID token。'
  - name: system
    description: 探活与元信息。

security: []

paths:
  # 🔴 路径是 /-/healthz 而不是 /healthz：
  #    **Cloud Run 的 Google Frontend 会拦截 /healthz，请求根本到不了容器。**
  #    2026-08-17 实测：/healthz 返回 Google 的 HTML 404 页且 Cloud Run 请求日志里
  #    连一条记录都没有；而同一部署下未注册的 /healthzz 返回我们 chi 路由的
  #    "404 page not found"，已注册的 /api/v1/plans 正常走到鉴权中间件。
  #    三者的唯一差别就是路径字符串，证据见 evidence/cloudrun-healthz-intercept-20260817。
  /-/healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 探活
      description: 返回纯文本 `ok`。**不套信封**（§2.2 例外三），探活不需要 JSON。
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            text/plain:
              schema:
                type: string
              example: ok
        '503':
          $ref: '#/components/responses/ErrDependencyDown'

  /api/v1/server/UniProxy/config:
    get:
      tags: [node]
      operationId: getUniProxyConfig
      summary: 节点自身配置（60 s 轮询，必须 ETag）
      description: |
        **冻结契约。** 响应是裸对象，字段照抄 Xboard `ServerService::buildNodeConfig()`，不改名、不改类型。

        - ETag 形状 `W/"<node_id>-c<config_rev>"`，只参与 `config_rev`；`/user` 用**不同的 ETag**，
          否则改配置会让用户列表也失效。
        - `If-None-Match` 用**弱比较**（RFC 9110 §8.8.3.2）；304 必须回带 `ETag` 与 `Cache-Control: no-cache`。
        - Go 侧手写比对，**不用 `http.ServeContent`**（它为文件设计，会引入 `Last-Modified` 与 Range 语义）。
        - `node_id` **从密钥推导**；请求里的 `node_id` 只用于日志与一致性检查，不一致返 403 `NODE_ID_MISMATCH`。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:config:read
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 节点配置（**裸 JSON，无信封**）
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeConfig'
        '304':
          $ref: '#/components/responses/NodeNotModified'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v2/server/config:
    get:
      tags: [node]
      operationId: getNodeConfigV2
      summary: 节点自身配置（v2node ≥ v0.4.0 实际请求的路径）
      description: |
        **与 `getUniProxyConfig` 是同一件事，响应逐字节相同。** 存在的唯一理由是实测：

        `wyx2685/v2node`（本项目选定的节点 agent，ADR 0006）自 **v0.4.0 起**把
        **且仅把**配置端点迁到了 `/api/v2/server/config`
        （`api/v2board/node.go:122` 的 `const path`），
        而 `/user` `/push` `/alive` `/alivelist` **四个仍留在 `/api/v1/server/UniProxy/*`**。
        它没有 `/status` 调用。

        🔴 **这条不一致是 2026-09-01 第一次真机装机时才发现的**，因为冻结契约抄的是
        **v2board 1.7.4 / Xboard**，而我们跑的是 v2node —— 两者在这一个端点上分了叉。
        失败形态极具误导性：v2node 拿到 Go 默认的 `404 page not found`，
        把它当 JSON 解析，报 `decode node params error: invalid character 'p' after top-level value`
        （`404` 是合法的顶层数字，后面的 `p` 才是报错点），**日志里完全看不出是路由不匹配**。

        响应结构无需改动：v2node 的 `CommonNode` 与本契约的 `NodeConfig` 字段逐个对得上，
        含 `tls_settings.xver` 是**字符串**这一条（`json:"xver,string"`）。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:config:read
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 节点配置（**裸 JSON，无信封**），与 `getUniProxyConfig` 相同
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeConfig'
        '304':
          $ref: '#/components/responses/NodeNotModified'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/server/UniProxy/user:
    get:
      tags: [node]
      operationId: getUniProxyUsers
      summary: 该节点可见的用户列表（60 s 轮询，必须 ETag）
      description: |
        **冻结契约。** 顶层形状固定为 `{"users":[…]}`。

        可用用户判定（照抄 Xboard `getAvailableUsers`）：
        `u + d < transfer_enable AND (expired_at IS NULL OR expired_at > now()) AND NOT banned
        AND group_id ∈ servers.group_ids`。`expired_at IS NULL` 天然支撑「不限时套餐」。

        ETag 形状 `W/"<node_id>-u<user_rev>"`，只参与 `user_rev`。bump 规则四条见 api-contract.md §3.8：
        改变可见用户集合的写操作 bump；**流量累加不 bump**；**跨过 `transfer_enable` 阈值必须 bump**；
        **`expired_at` 到点必须由 `/internal/tasks/expire-check` bump**。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:users:read
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 用户列表（**裸 JSON，无信封**）
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeUserList'
        '304':
          $ref: '#/components/responses/NodeNotModified'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/server/UniProxy/push:
    post:
      tags: [node]
      operationId: pushUniProxyTraffic
      summary: 流量上报（增量字节）
      description: |
        **冻结契约。** 请求体是 `{uid: [upload, download]}` 形状的 map，值是**增量字节**，不是累计值。

        - key 是用户 id 的**字符串**（JSON 对象键必然是字符串），对应 `/user` 返回的 `id`
        - value 是长度**恰为 2** 的非负整数数组 `[upload, download]`
        - **不做任何倍率折算，原样上报原始字节**
        - 非「长度 2 的数值数组」的条目**静默丢弃，不让整批失败**（照抄 Xboard `processTraffic()`），丢弃计数进 metric

        **响应时间预算 < 50 ms**：请求路径上只做「INSERT traffic_batch」+「enqueue Cloud Tasks」两件事，
        累加、聚合、阈值判定全部在 `/internal/tasks/traffic-batch` 侧做。
        `/push` 越慢，v2node 超时重试的概率越高，而**节点侧重试无法幂等**（§9.2）。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:traffic:write
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTrafficPushRequest'
            example:
              '1': [10485760, 52428800]
              '7': [1024, 8192]
              '19': [0, 314572800]
      responses:
        '200':
          $ref: '#/components/responses/NodeAck'
        '400':
          $ref: '#/components/responses/NodeBadRequest'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/server/UniProxy/alive:
    post:
      tags: [node]
      operationId: pushUniProxyAlive
      summary: 在线设备上报（按 IP，不是按设备）
      description: |
        **冻结契约。** 请求体是 `{uid: [ip, …]}`，写入 ADR 0005 §8 裁定的 `UNLOGGED` 表 `user_alive`
        （`ON CONFLICT (user_id, node_id, device_ip) DO UPDATE SET seen_at = now()`），
        清理由 `/internal/tasks/alive-gc` 每 5 分钟做。

        > ⚠️ **口径必须原样承认**：这是**按 IP** 计，不是按设备计。同一台手机在 Wi-Fi 与蜂窝之间切换会占两个名额。
        > 契约层面只能照抄（v2node 只上报 IP），因此 page-inventory §3.2.3 要求把口径写在页面上，
        > 并提供用户自助「踢下线」。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:alive:write
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeAlivePushRequest'
            example:
              '1': ['203.0.113.7', '198.51.100.42']
              '7': ['203.0.113.99']
      responses:
        '200':
          $ref: '#/components/responses/NodeAck'
        '400':
          $ref: '#/components/responses/NodeBadRequest'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/server/UniProxy/alivelist:
    get:
      tags: [node]
      operationId: getUniProxyAliveList
      summary: 全网在线计数（多节点共享设备数限制的唯一机制）
      description: |
        **冻结契约。** 响应只含 `device_limit > 0` 的用户。节点先拉全网计数，再本地决策是否放行新连接。

        > ⚠️ **拒新还是踢旧是 v2node 的本地行为，我们无法通过契约控制**，而 user-journey §12.2
        > 要求的是「拒新不踢旧」—— **v2node 的实际行为待核实**。
        > Xboard 的 `alivelist` 究竟按 IP 还是按连接计数，同样**待核实**。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:alive:read
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 在线计数（**裸 JSON，无信封**）
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeAliveList'
        '304':
          $ref: '#/components/responses/NodeNotModified'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/server/UniProxy/status:
    post:
      tags: [node]
      operationId: pushUniProxyStatus
      summary: 节点负载快照（只写快照，不建历史表）
      description: |
        **冻结契约。** 校验规则与 Xboard 一致：`cpu` 为 `numeric` 且 `0 ≤ cpu ≤ 100`；其余六个为 `integer` 且 `≥ 0`。
        **`cpu` 是本 spec 里唯一允许的浮点字段**（§2.6）。

        **裁决：只写快照。** 落 `servers.load_status jsonb` + `servers.last_status_at`，一节点一行，被覆盖。
        8 节点 × 1440 次/天 = 11,520 行/天的负载历史对本项目规模没有决策价值，而 ADR 0005 的 10 GB SSD 要付钱。
        需要趋势时接 Cloud Monitoring，不自建时序表。
      security:
        - nodeKey: []
        - nodeKeyQueryTransitional: []
      x-required-scope: node:status:write
      parameters:
        - $ref: '#/components/parameters/NodeIdQuery'
        - $ref: '#/components/parameters/NodeTypeQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeStatusReport'
            example:
              cpu: 12.3
              mem: { total: 2074152960, used: 812345344 }
              swap: { total: 0, used: 0 }
              disk: { total: 10434699264, used: 3221225472 }
      responses:
        '200':
          $ref: '#/components/responses/NodeAck'
        '400':
          $ref: '#/components/responses/NodeBadRequest'
        '401':
          $ref: '#/components/responses/NodeUnauthorized'
        '403':
          $ref: '#/components/responses/NodeForbidden'
        '429':
          $ref: '#/components/responses/NodeRateLimited'
        '500':
          $ref: '#/components/responses/NodeInternalError'

  /api/v1/client/subscribe:
    get:
      tags: [client]
      operationId: getClientSubscription
      summary: 订阅下发（与 Xboard 同形的长路径）
      description: |
        与 Xboard 同形，方便从竞品/旧配置迁移。与 `GET /s/{token}` 走**完全相同的 handler 与鉴权链**。

        token 校验：长度/字符集不合法 → 直接 404 不查库；`sha256(token)` 查 `sub_tokens`；
        未找到 / `revoked_at IS NOT NULL` / `issued_at < users.sub_revoked_at` → **一律 404，不是 403**
        （403 会告诉攻击者「这个 token 存在但你不能用」）。
        每次拉取**同步**写审计表 `subscribe_log(user_id, sub_token_id, request_ip, user_agent, request_at)`。

        到期 / 配额耗尽 / 封禁 → **200 + 空节点列表 + 伪节点**（订阅 URL 本身就是通知通道，user-journey §11.2）。

        **不设 `ETag`**：订阅内容内嵌当前用量数字，每次都在变；更要紧的是 304 会让客户端继续显示旧的流量条。
      security: []
      parameters:
        - $ref: '#/components/parameters/SubscribeTokenQuery'
        - $ref: '#/components/parameters/SubscribeFlagQuery'
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionPayload'
        '404':
          # ⚠️ 这里刻意**内联**而不是 $ref 到 components/responses/SubscriptionNotFound。
          # oapi-codegen 对 $ref 的 text/plain 响应会生成一个嵌入结构体，
          # 然后在 visitor 里执行 []byte(response) —— 结构体转 []byte，编译不过。
          # 根因是 oapi-codegen 尚未完整支持 OpenAPI 3.1（上游 issue #373）。
          # 内联后生成 `type ...404TextResponse string`，正常工作。
          # 上游修复后可以改回 $ref，届时删掉这段注释。
          description: |
            **token 不存在 / 已吊销 / `issued_at < users.sub_revoked_at` —— 一律 404，不是 403。**
            403 会告诉攻击者「这个 token 存在但你不能用」（ADR 0006 §10.2）。

            注意：**banned / 到期 / 配额耗尽不走这里**，它们是 200 + 空列表 + 伪节点。
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/ErrRateLimited'
        '500':
          $ref: '#/components/responses/ErrInternal'

