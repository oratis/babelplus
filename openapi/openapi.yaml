    post:
      tags: [user]
      operationId: sendEmailCode
      summary: 发送邮件验证码（兼「失联生命线」送达率探针）
      description: |
        user-journey §1 把注册验证码定为「失联生命线的免费持续压测」。依 ADR 0002，邮件是唯一失联恢复通道，
        **收不到验证码的用户就是封锁当天必然失联的用户**。

        因此每次发码必须写一条 `email_probe(recipient_domain, esp, bounce_code, sent_at, delivered_at)`，
        按收件域名分组统计，直接充当 ADR 0002 §7 要求的送达率实测数据源。
        **这不是附带功能，是这个端点存在的第二个理由。**

        限流：per email 3/h，且同一邮箱两次间隔 ≥ 60 s（走 Postgres 精确档，§10.2）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '204':
          description: 已受理（**无论邮箱是否已注册都返回 204**，防枚举）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '422':
