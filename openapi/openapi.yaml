  /api/v1/orders/{trade_no}/pay:
    post:
      tags: [user]
      operationId: payOrder
      summary: 发起支付，返回收银台数据（**需 `Idempotency-Key`**）
      description: |
        USDT 路径的三条硬约束：

        1. **`amount_usdt6` 的末位是订单识别码。** pricing-and-plans §4.2 裁定用「小地址池 + 金额唯一性」
           （抄 EPUSDT：冲突则 `+0.0001` 递增重试，最多 100 次）。`+0.0001 USDT = +100 usdt6`。
           `note` 字段的存在是因为 user-journey 列出的七个卡点里**第三个就是「四位小数尾数像诈骗」** ——
           不解释这个尾数，用户会停在这一步。
        2. **`state` 的取值必须含 `underpaid`**（少付一定会发生，提币手续费从转出额扣是头号成因）。
           `underpaid` 时额外带 `shortfall_usdt6`，前端显示「已收到 X，还差 Y」而不是笼统的「支付失败」。
        3. **`confirmations_required` 必须可配置下发，不能硬编码在前端。**
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/TradeNoPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
