# bp-web / bp-admin 的 nginx 配置（两个 SPA 共用一份；差异只在镜像里 COPY 进来的 dist）。
#
# 与 infra/site/nginx.conf 的三处不同，都有具体理由：
#  1. **SPA 回退**：`/order/xxx` 这类路径刷新时必须回 index.html（web/user/src/main.tsx 的部署要求），
#     否则用户刷新任何二级页都是 404。静态资源仍按文件命中，命不中才回退。
#  2. **`/runtime-config.js` 不许缓存**：备用域名池写在这个文件里，用户拿到旧缓存的时刻恰好是
#     最需要新域名的时刻（deploy.md §11.3）。经 LB 访问时这条路径由 backend bucket 接管
#     （url-map bp-admin-lb 的 path rule），镜像里这份只在直连 run.app 时被取到 —— 同样 no-cache。
#  3. **CSP 比官网松**：SPA 要连 API（同源 `/api/*` 由 LB 路由）与 runtime-config 里的域名池，
#     connect-src 无法在这里穷举，所以只钉 script-src / object-src / frame-ancestors 这三条不会误伤的。
#
# ⚠️ nginx 的 add_header **不继承**：location 里只要写了任何一条 add_header，server 级的就全部失效。
#    所以安全头放在 headers.conf 里，每个自己加 Cache-Control 的 location 都要再 include 一次；
#    否则恰好是 index.html（最需要 CSP 的那一份）没有安全头。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css text/html application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/bp-headers.conf;

    location = /runtime-config.js {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 健康检查路径是 /-/healthz 而不是 /healthz：Cloud Run 的 Google Frontend 会拦截 /healthz
    # （docs/evidence/cloudrun-healthz-intercept-20260817；bp-api / bp-site 同此）。
    location = /-/healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 其余一切（含 index.html 与 SPA 回退）：no-cache，命不中文件就回 index.html。
    location / {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
