# bp-web / bp-admin 的安全响应头。被 nginx.conf 在 server 级与每个带 Cache-Control 的 location 里各 include 一次
# （nginx 的 add_header 不跨层继承，见 nginx.conf 顶部说明）。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
# HSTS 一年、不含 preload：preload 不可逆，域名策略还在变（ADR 0016）。
add_header Strict-Transport-Security "max-age=31536000" always;
