# bp-site 的安全响应头。被 nginx.conf 在 server 级与每个带 Cache-Control 的 location 里各 include 一次：
# nginx 的 add_header **不跨层继承** —— location 里只要写了任何一条 add_header，server 级的就全部失效。
# 2026-09-05 实测：改之前 https://babel.plus/ 的响应里没有 CSP 也没有 HSTS（恰好是 index.html 这一份），
# 只有 /assets/ 之外的零散路径才带。
#
# 站点自己不发任何请求（零 JS、零外部资源），所以 CSP 可以收得很紧。
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS 只在这里声明一年，不含 preload：preload 是不可逆的，域名策略还在变（ADR 0016）。
add_header Strict-Transport-Security "max-age=31536000" always;
