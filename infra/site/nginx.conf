# bp-site 的 nginx 配置。
#
# 三条与「默认配置」不同、且都有具体理由的地方：
#  1. `index.html` **不许被缓存**：域名池与可售状态都写在这一页里，
#     用户拿到旧缓存的时刻恰好是最需要新内容的时刻（同 deploy.md 对 runtime-config.js 的要求）。
#  2. 带哈希的资源 `immutable`：它们的内容永不变，重复校验是纯浪费的一次往返，
#     而跨境链路上每一次往返都贵。
#  3. 安全头写在这里而不是应用里：这是一台只发静态文件的服务器，应用层没有别的地方可写。
#     ⚠️ 它们放在 headers.conf 里、每个带 Cache-Control 的 location 都要再 include 一次 ——
#     nginx 的 add_header 不跨层继承（2026-09-05 之前 `/` 因此没有 CSP/HSTS，见 headers.conf）。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css text/html application/javascript image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/bp-headers.conf;

    location = / {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/bp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 健康检查：不查任何东西，只证明进程在接 HTTP。
    # 🔴 路径是 `/-/healthz` 而不是 `/healthz` —— **Cloud Run 的 Google Frontend 会拦截 /healthz**，
    #    请求根本到不了容器（证据 docs/evidence/cloudrun-healthz-intercept-20260817，2026-08-17 实测；
    #    2026-09-04 在本服务上又验证了一次：容器本地 200，经 Cloud Run 是 GFE 的 404）。
    #    bp-api 因此也用 /-/healthz，两处保持一致。
    location = /-/healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
