# bp-site 的 nginx 配置。
#
# 三条与「默认配置」不同、且都有具体理由的地方：
#  1. `index.html` **不许被缓存**：域名池与可售状态都写在这一页里，
#     用户拿到旧缓存的时刻恰好是最需要新内容的时刻（同 deploy.md 对 runtime-config.js 的要求）。
#  2. 带哈希的资源 `immutable`：它们的内容永不变，重复校验是纯浪费的一次往返，
#     而跨境链路上每一次往返都贵。
#  3. 安全头写在这里而不是应用里：这是一台只发静态文件的服务器，应用层没有别的地方可写。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css text/html application/javascript image/svg+xml;
    gzip_min_length 512;

    # 站点自己不发任何请求（零 JS、零外部资源），所以 CSP 可以收得很紧。
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS 只在这里声明一年，不含 preload：preload 是不可逆的，域名策略还在变（ADR 0016）。
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 健康检查：不查任何东西，只证明进程在接 HTTP（同 bp-api 的 /healthz 口径）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
