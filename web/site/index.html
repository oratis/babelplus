<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>babel.plus — a private browser for laptops in China</title>
    <meta
      name="description"
      content="A private browser and a browser extension for people who bring a laptop to China. They route that browser through your babel.plus pass; nothing else on your computer is touched."
    />
    <!--
      🔴 这一页刻意**允许**被搜索引擎收录（与面板相反：面板是 noindex）。
      它是渠道的一部分 —— go-to-market §4.3 把英文长尾内容定为「转化支撑」，
      而一个 noindex 的官网连支撑都做不了。
    -->
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="babel.plus" />
    <meta property="og:description" content="A private browser for laptops in China. It routes one browser; nothing else on your computer is touched." />
    <meta property="og:type" content="website" />
    <!-- favicon 用内联 data URI：零外部请求（ADR 0003 §5）。图形与两个客户端的图标同源。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231B4D8F' stroke-width='3'/%3E%3Cellipse cx='16' cy='16' rx='4.6' ry='11' fill='none' stroke='%231B4D8F' stroke-width='2'/%3E%3Cpath d='M3 16h26' stroke='%231B4D8F' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!--PAGE-->
  </body>
</html>
