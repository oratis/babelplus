<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- 后台绝不该被索引。这不是安全措施，但少一条被自动扫描发现的路径总是好的。 -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- 后台页面里会出现用户邮箱、订单号、节点名，一律不外泄到 Referer。 -->
    <meta name="referrer" content="no-referrer" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b1d1d'/%3E%3Cpath d='M9 22V10h6a3.5 3.5 0 0 1 0 7H9m0 0h7a3.5 3.5 0 0 1 0 7H9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <title>babel.plus 后台</title>

    <!-- 与用户面板同机制，但 mirrorDomains 恒为空 —— 后台不做镜像。 -->
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif">后台需要 JavaScript。</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
